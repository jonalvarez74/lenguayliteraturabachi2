  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;

      font-family: 'Playfair Display', serif;
    }
    /* Estructura DINA4 Apaisada proporcional */
    .a4-landscape-page {
      width: 297mm;
      height: 210mm;
      max-width: 100%;
      aspect-ratio: 297 / 210;
    }
    @media print {
      body {
        background: white;
        color: black;
        margin: 0;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .print-fullscreen {
        width: 297mm !important;
        height: 210mm !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 8mm !important;
        page-break-inside: avoid;
        background: white !important;
      }
      @page {
        size: A4 landscape;
        margin: 0;
      }
    }
  </style>
</head>

    <div class="flex items-center gap-3">
      <div class="p-2 bg-teal-50 rounded-lg text-teal-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">

      <div>
        <h1 class="text-lg font-bold text-slate-900 leading-tight">Organizador Visual EAU • La Coherencia</h1>
        <p class="text-xs text-slate-500">Esquema compositivo, jerarquía de ideas y progresión temática (Decreto 76/2023)</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Selector de simulación de estructuras -->
      <div class="flex items-center gap-2">
        <label for="structureSelect" class="text-xs font-semibold text-slate-600">Esquema Compositivo:</label>
        <select id="structureSelect" onchange="highlightStructure()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-medium focus:ring-2 focus:ring-teal-500 outline-none">
          <option value="none">Seleccionar...</option>
          <option value="analizante">Deductivo (Analizante)</option>
          <option value="sintetizante">Inductivo (Sintetizante)</option>
          <option value="encuadrada">Circular (Encuadrado)</option>
          <option value="paralela">Paralelo</option>
        </select>
      </div>

      <!-- Modo Ficha Activa -->
      <button id="toggleModeBtn" onclick="toggleEditMode()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg font-medium text-sm hover:bg-slate-50 flex items-center gap-2 transition">
        <span id="modeIcon">🔓</span>
        <span id="modeText">Modo Ejercicio</span>
      </button>

      <!-- Botón Imprimir -->
      <button onclick="window.print()" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-semibold text-sm flex items-center gap-2 transition shadow-sm">

  <!-- CONTENEDOR DINA4 APAISADO -->
